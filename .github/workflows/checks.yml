name: Protocol checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install bleak==3.0.2
      - run: python -m unittest discover -v
      - name: Native settings smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import shutil, tempfile
          from settings_ui import open_settings
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              shutil.copy('config.example.json', root / 'config.example.json')
              open_settings(root, smoke_test=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Settings smoke test failed' }
      - run: python -m compileall -q bridge.py protocol.py hd_rumble.py dsu.py native_pro.py configuration.py settings_ui.py ble_connection.py
